<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0d1117;color:#e6edf3;font-family:system-ui,sans-serif;overflow-x:hidden;user-select:none;-webkit-user-select:none}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:#161b22}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:4px}
.no-scroll{overflow:hidden}
.card-stack{position:relative;width:min(85vw,380px);height:65vh;max-height:560px;min-height:420px}
.swipe-card{position:absolute;width:100%;height:100%;border-radius:1rem;overflow:hidden;touch-action:none;will-change:transform;transition:none;cursor:grab}
.swipe-card.behind{pointer-events:none;border:1px solid rgba(48,54,61,.6)}
.swipe-card:active{cursor:grabbing}
.card-gradient{position:absolute;inset:0;z-index:0}
.card-content{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;justify-content:flex-end;padding:1.25rem;background:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,.5) 40%,rgba(0,0,0,.15) 70%,transparent 100%)}
.card-emoji{position:absolute;top:50%;left:50%;transform:translate(-50%,-70%);font-size:64px;z-index:1;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5));opacity:.9}
.swipe-overlay{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;border-radius:1rem;pointer-events:none;opacity:0;transition:opacity .15s}
.swipe-overlay.like{background:rgba(34,197,94,.15);border:3px solid #22c55e}
.swipe-overlay.nope{background:rgba(229,9,20,.15);border:3px solid #e50914}
.swipe-overlay.super{background:rgba(240,180,41,.15);border:3px solid #f0b429}
.overlay-label{font-size:2rem;font-weight:800;letter-spacing:2px;padding:.5rem 1.5rem;border-radius:.75rem}
.swipe-overlay.like .overlay-label{color:#22c55e;border:3px solid #22c55e;transform:rotate(-15deg)}
.swipe-overlay.nope .overlay-label{color:#e50914;border:3px solid #e50914;transform:rotate(15deg)}
.swipe-overlay.super .overlay-label{color:#f0b429;border:3px solid #f0b429;transform:rotate(0)}
.mood-pill{padding:6px 14px;border-radius:999px;font-size:.75rem;font-weight:600;background:#21262d;color:#8b949e;border:1.5px solid #30363d;white-space:nowrap;cursor:pointer;transition:all .2s}
.mood-pill.active{background:rgba(240,180,41,.15);color:#f0b429;border-color:#f0b429}
.genre-pill{padding:3px 10px;border-radius:999px;font-size:.65rem;font-weight:600;letter-spacing:.3px}
.platform-badge{padding:2px 8px;border-radius:6px;font-size:.6rem;font-weight:700;letter-spacing:.3px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#161b22;border-top:1px solid #30363d;z-index:100;display:flex;justify-content:space-around;padding:6px 0 env(safe-area-inset-bottom,8px)}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 12px;border:none;background:none;color:#8b949e;font-size:.6rem;font-weight:600;cursor:pointer;transition:color .2s;min-width:60px}
.nav-btn.active{color:#f0b429}
.nav-btn i{width:22px;height:22px}
.action-btn-wrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.action-btn-label{font-size:.6rem;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.action-btn{border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;background:transparent;border:none}
.action-btn:hover{transform:scale(1.12)}
.action-btn.skip{width:56px;height:56px;border:2px solid #e50914;color:#e50914;background:transparent}
.action-btn.skip:hover{background:rgba(229,9,20,.12)}
.action-btn.like-btn{width:56px;height:56px;background:#22c55e;color:#fff;border:none;box-shadow:0 4px 16px rgba(34,197,94,.35)}
.action-btn.like-btn:hover{background:#16a34a;box-shadow:0 6px 20px rgba(34,197,94,.5)}
.action-btn.super-btn{width:48px;height:48px;border:2px solid #f0b429;color:#f0b429;background:transparent}
.action-btn.super-btn:hover{background:rgba(240,180,41,.12)}
.wl-card{background:#161b22;border-radius:.75rem;overflow:hidden;cursor:pointer;border:1px solid #30363d;transition:transform .2s;position:relative}
.wl-card:hover{transform:translateY(-2px)}
.wl-card-inner{position:relative;z-index:1;background:#161b22;transition:transform .25s ease}
.wl-delete-reveal{position:absolute;inset:0;background:#e50914;display:flex;align-items:center;justify-content:flex-end;padding-right:1.25rem;border-radius:.75rem;color:#fff;font-weight:700;font-size:.8rem}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal-content{width:100%;max-width:430px;max-height:90vh;background:#161b22;border-radius:1.25rem 1.25rem 0 0;border:1px solid #30363d;overflow-y:auto;transform:translateY(100%);transition:transform .3s}
.modal-overlay.open .modal-content{transform:translateY(0)}
.onboarding-screen{position:fixed;inset:0;z-index:300;background:#0d1117;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;transition:opacity .4s,transform .4s}
.onboarding-screen.hidden{opacity:0;pointer-events:none;transform:translateX(40px)}
.onboarding-screen.active{opacity:1;transform:translateX(0)}
.confetti-particle{position:fixed;width:8px;height:8px;border-radius:2px;z-index:250;pointer-events:none;animation:confettiFall 2s ease-in forwards}
@keyframes confettiFall{0%{opacity:1;transform:translateY(0) rotate(0deg)}100%{opacity:0;transform:translateY(100vh) rotate(720deg)}}
@keyframes cardEnter{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes cardTilt{0%{transform:rotate(0deg)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}100%{transform:rotate(0deg)}}
.bar-fill{height:24px;border-radius:6px;background:linear-gradient(90deg,#f0b429,#fcd34d);width:0;transition:width .6s ease}
.match-pct{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#f0b429;font-size:.65rem;font-weight:700;padding:3px 8px;border-radius:999px;z-index:3;backdrop-filter:blur(4px)}
.tabs-scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;padding:0 4px}
.tabs-scroll::-webkit-scrollbar{display:none}
.group-badge{background:rgba(240,180,41,.15);color:#f0b429;border:1px solid #f0b429;padding:4px 12px;border-radius:999px;font-size:.7rem;font-weight:700;cursor:pointer;transition:all .2s}
.group-badge.active{background:#f0b429;color:#0d1117}
.stat-card{background:#21262d;border-radius:.75rem;padding:12px;text-align:center;flex:1;min-width:70px}
.stat-num{font-size:1.25rem;font-weight:800;color:#e6edf3}
.stat-label{font-size:.6rem;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
</style>
</head>

  groupDeck:[],

// Persistence
const SDK = window.AppSDK;
const STORE_ID = 'cineswipe-state';

async function loadState(){
  try {
    const doc = await SDK.get(STORE_ID, 'main');
    if(doc && doc.data){
      const d = doc.data;
      state.onboarded = d.onboarded || false;
      state.watchlist = d.watchlist || [];
      state.superlikes = d.superlikes || [];
      state.taste = d.taste || {genreScores:{},moodScores:{},decadeScores:{},platformScores:{},directorScores:{},ratingMin:10};
      state.swipes = d.swipes || [];
      state.activeMoods = d.activeMoods || [];
    }
  } catch(e) { /* first load */ }
}

async function save(){
  try {
    await SDK.upsert(STORE_ID, 'main', {
      onboarded: state.onboarded,
      watchlist: state.watchlist,
      superlikes: state.superlikes,
      taste: state.taste,
      swipes: state.swipes,
      activeMoods: state.activeMoods
    });
  } catch(e) { /* silent */ }
}

function getDecade(y){if(y<2000)return'90s';if(y<2010)return'00s';if(y<2020)return'10s';return'20s'}
function getSwipedIds(){return state.swipes.map(s=>s.id)}
function buildDeck(){
  const swiped=getSwipedIds();
  let pool=MOVIES.filter(m=>!swiped.includes(m.id));
  if(state.activeMoods.length>0){
    pool=pool.filter(m=>m.mood.some(mo=>state.activeMoods.includes(mo)));
  }
  if(state.swipes.length>=5){
    pool.sort((a,b)=>tasteScore(b)-tasteScore(a));
  }else{
    for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  }
  state.deck=pool;
}
function tasteScore(movie){
  let s=0;const t=state.taste;
  movie.genres.forEach(g=>{s+=(t.genreScores[g]||0)*2});
  movie.mood.forEach(m=>{s+=(t.moodScores[m]||0)*1.5});
  s+=(t.decadeScores[getDecade(movie.year)]||0);
  movie.platforms.forEach(p=>{s+=(t.platformScores[p]||0)*0.5});
  s+=(t.directorScores[movie.director]||0)*1.5;
  return s;
}
function tastePercent(movie){
  if(state.swipes.length<5)return null;
  const s=tasteScore(movie);const maxPossible=Math.max(...MOVIES.map(m=>tasteScore(m)),1);
  return Math.min(99,Math.max(40,Math.round((s/maxPossible)*100)));
}
function updateTaste(movie,dir){
  const t=state.taste;const mult=dir==='super'?4:dir==='like'?2:-1;
  movie.genres.forEach(g=>{t.genreScores[g]=(t.genreScores[g]||0)+mult});
  movie.mood.forEach(m=>{t.moodScores[m]=(t.moodScores[m]||0)+mult});
  const d=getDecade(movie.year);t.decadeScores[d]=(t.decadeScores[d]||0)+mult;
  movie.platforms.forEach(p=>{t.platformScores[p]=(t.platformScores[p]||0)+mult});
  t.directorScores[movie.director]=(t.directorScores[movie.director]||0)+mult;
  if(dir!=='skip'&&movie.rating<t.ratingMin)t.ratingMin=movie.rating;
  if(state.swipes.length%5===0)buildDeck();
}

// CARD RENDERING & SWIPING
// ══════════════════════════════════════════
let cardEls=[];let isDragging=false;let startX=0,startY=0,currentX=0,currentY=0;
let cardStartTime=0;

function renderCards(){
  const stack=document.getElementById('card-stack');
  const empty=document.getElementById('empty-deck');
  const actions=document.getElementById('action-buttons');
  stack.innerHTML='';cardEls=[];
  if(state.deck.length===0){
    empty.classList.remove('hidden');
    actions.style.opacity='0.3';actions.style.pointerEvents='none';
    const statsEl=document.getElementById('session-stats');
    if(statsEl){
      statsEl.innerHTML=`
        <div class="stat-card"><div class="stat-num">${state.sessionLiked}</div><div class="stat-label">Liked</div></div>
        <div class="stat-card"><div class="stat-num">${state.sessionSkipped}</div><div class="stat-label">Skipped</div></div>
        <div class="stat-card"><div class="stat-num">${state.sessionLiked+state.sessionSkipped}</div><div class="stat-label">Total</div></div>
      `;
    }
    return;
  }
  empty.classList.add('hidden');actions.style.opacity='1';actions.style.pointerEvents='auto';
  const show=state.deck.slice(0,3);
  show.forEach((movie,i)=>{
    const card=document.createElement('div');
    card.className='swipe-card'+(i>0?' behind':'');
    // Card stack visual depth
    const sc=i===0?1:i===1?0.95:0.90;
    const ty=i===0?0:i===1?10:20;
    const op=i===0?1:i===1?0.6:0.35;
    card.style.transform=`scale(${sc}) translateY(${ty}px)`;
    card.style.zIndex=10-i;
    card.style.opacity=op;

    const matchPct=tastePercent(movie);
    card.innerHTML=`
      ${matchPct?`<div class="match-pct">🎯 ${matchPct}% Match</div>`:''}
      <div class="card-gradient" style="background:${movie.posterGradient}"></div>
      <div class="card-emoji">${movie.emoji}</div>
      <div class="card-content">
        <h3 class="text-xl font-bold mb-1" style="text-shadow:0 2px 8px rgba(0,0,0,.7)">${movie.title}</h3>
        <div class="flex items-center gap-2 text-xs mb-2" style="color:#ccc">
          <span>${movie.year}</span><span>·</span><span>⭐ ${movie.rating}</span><span>·</span><span>${movie.runtime}</span>
        </div>
        <div class="flex flex-wrap gap-1 mb-2">
          ${movie.genres.map(g=>`<span class="genre-pill" style="background:rgba(255,255,255,.15);color:#fff">${g}</span>`).join('')}
        </div>
        <p class="text-xs italic mb-2" style="color:#bbb">"${movie.tagline}"</p>
        <p class="text-xs mb-2" style="color:#999">${movie.cast.slice(0,3).join(' · ')}</p>
        <div class="flex gap-1 justify-end">
          ${movie.platforms.map(p=>`<span class="platform-badge" style="background:${PLATFORM_COLORS[p]||'#333'};color:#fff">${p}</span>`).join('')}
        </div>
      </div>
      <div class="swipe-overlay like"><span class="overlay-label">LIKE</span></div>
      <div class="swipe-overlay nope"><span class="overlay-label">NOPE</span></div>
      <div class="swipe-overlay super"><span class="overlay-label">SUPER</span></div>
    `;
    stack.appendChild(card);
    cardEls.push({el:card,movie});
  });
  attachSwipe();
}

function attachSwipe(){
  if(cardEls.length===0)return;
  const card=cardEls[0].el;
  card.addEventListener('pointerdown',onPointerDown);
  card.addEventListener('pointermove',onPointerMove);
  card.addEventListener('pointerup',onPointerUp);
  card.addEventListener('pointercancel',onPointerUp);
}
function onPointerDown(e){
  isDragging=true;startX=e.clientX;startY=e.clientY;currentX=0;currentY=0;cardStartTime=Date.now();
  cardEls[0].el.setPointerCapture(e.pointerId);
  cardEls[0].el.style.transition='none';
}
function onPointerMove(e){
  if(!isDragging||!cardEls.length)return;
  currentX=e.clientX-startX;currentY=e.clientY-startY;
  const rot=currentX*0.08;
  const clampedRot=Math.max(-30,Math.min(30,rot));
  cardEls[0].el.style.transform=`translate(${currentX}px,${currentY}px) rotate(${clampedRot}deg)`;
  const likeOv=cardEls[0].el.querySelector('.swipe-overlay.like');
  const nopeOv=cardEls[0].el.querySelector('.swipe-overlay.nope');
  const superOv=cardEls[0].el.querySelector('.swipe-overlay.super');
  if(currentX>0){likeOv.style.opacity=Math.min(1,currentX/100);nopeOv.style.opacity=0}
  else{nopeOv.style.opacity=Math.min(1,-currentX/100);likeOv.style.opacity=0}
  if(currentY<-40)superOv.style.opacity=Math.min(1,-currentY/80);else superOv.style.opacity=0;
}
function onPointerUp(e){
  if(!isDragging||!cardEls.length)return;isDragging=false;
  const elapsed=Date.now()-cardStartTime;
  const vx=Math.abs(currentX)/(elapsed||1)*1000;
  const vy=Math.abs(currentY)/(elapsed||1)*1000;
  if(currentY<-80||(currentY<-40&&vy>800)){doSwipe('super');return}
  if(currentX>100||(currentX>50&&vx>600)){doSwipe('like');return}
  if(currentX<-100||(currentX<-50&&vx>600)){doSwipe('skip');return}
  const card=cardEls[0].el;
  card.style.transition='transform .4s cubic-bezier(.2,.8,.3,1)';
  card.style.transform='translate(0,0) rotate(0deg)';
  card.querySelector('.swipe-overlay.like').style.opacity=0;
  card.querySelector('.swipe-overlay.nope').style.opacity=0;
  card.querySelector('.swipe-overlay.super').style.opacity=0;
}

function doSwipe(dir){
  if(cardEls.length===0)return;
  const {el,movie}=cardEls[0];
  el.style.transition='transform .5s cubic-bezier(.2,.8,.3,1),opacity .5s';
  if(dir==='like'){el.style.transform='translate(150vw,0) rotate(30deg)';el.querySelector('.swipe-overlay.like').style.opacity=1}
  else if(dir==='skip'){el.style.transform='translate(-150vw,0) rotate(-30deg)';el.querySelector('.swipe-overlay.nope').style.opacity=1}
  else{el.style.transform='translate(0,-150vh) rotate(0deg)';el.querySelector('.swipe-overlay.super').style.opacity=1}
  el.style.opacity='0';

  if(state.groupMode){
    if(!state.groupSwipes[state.groupNames[state.groupCurrentPerson]])state.groupSwipes[state.groupNames[state.groupCurrentPerson]]=[];
    state.groupSwipes[state.groupNames[state.groupCurrentPerson]].push({id:movie.id,dir});
  }

  if(dir==='like'||dir==='super')state.sessionLiked++;
  else state.sessionSkipped++;

  setTimeout(()=>{
    if(!state.groupMode){
      state.swipes.push({id:movie.id,direction:dir,timestamp:Date.now()});
      if(dir==='like'||dir==='super'){
        if(!state.watchlist.includes(movie.id))state.watchlist.push(movie.id);
        if(dir==='super'&&!state.superlikes.includes(movie.id))state.superlikes.push(movie.id);
      }
      updateTaste(movie,dir);
      save();
    }
    state.deck.shift();
    if(state.groupMode&&state.deck.length===0){
      advanceGroupPerson();
    }else{
      renderCards();
    }
  },300);
}

function renderMoods(){
  const bar=document.getElementById('mood-bar');
  bar.innerHTML=MOODS.map(m=>{
    const active=m.id==='all'?state.activeMoods.length===0:state.activeMoods.includes(m.id);
    return `<button class="mood-pill${active?' active':''}" data-mood="${m.id}">${m.emoji} ${m.label}</button>`;
  }).join('');
  bar.querySelectorAll('.mood-pill').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const mid=btn.dataset.mood;
      if(mid==='all'){state.activeMoods=[];}
      else{
        const idx=state.activeMoods.indexOf(mid);
        if(idx>-1)state.activeMoods.splice(idx,1);else state.activeMoods.push(mid);
      }
      save();buildDeck();renderCards();renderMoods();
    });
  });
}

function spawnConfetti(){

    setTimeout(()=>p.remove(),3500);
  }
}

// ══════════════════════════════════════════
// WATCHLIST
// ══════════════════════════════════════════
function renderWatchlist(){
  const grid=document.getElementById('wl-grid');
  const empty=document.getElementById('wl-empty');
  const sortBar=document.getElementById('wl-sort-bar');
  const platBar=document.getElementById('wl-platform-bar');

  const sorts=[{id:'added',label:'Date Added'},{id:'rating',label:'Rating'},{id:'genre',label:'Genre'}];
  sortBar.innerHTML=sorts.map(s=>`<button class="mood-pill${state.wlSort===s.id?' active':''}" data-wlsort="${s.id}">${s.label}</button>`).join('');
  sortBar.querySelectorAll('[data-wlsort]').forEach(b=>b.addEventListener('click',()=>{state.wlSort=b.dataset.wlsort;renderWatchlist()}));

  const plats=['All',...ALL_PLATFORMS];
  platBar.innerHTML=plats.map(p=>`<button class="mood-pill${state.wlPlatform===p?' active':''}" data-wlplat="${p}" style="font-size:.65rem">${p}</button>`).join('');
  platBar.querySelectorAll('[data-wlplat]').forEach(b=>b.addEventListener('click',()=>{state.wlPlatform=b.dataset.wlplat;renderWatchlist()}));

  let movies=state.watchlist.map(id=>MOVIES.find(m=>m.id===id)).filter(Boolean);
  if(state.wlPlatform!=='All')movies=movies.filter(m=>m.platforms.some(p=>p===state.wlPlatform));
  if(state.wlSort==='rating')movies.sort((a,b)=>b.rating-a.rating);
  else if(state.wlSort==='genre')movies.sort((a,b)=>a.genres[0].localeCompare(b.genres[0]));

  if(movies.length===0){
    grid.innerHTML='';
    empty.classList.remove('hidden');
    // Hide sort/platform bars when empty
    if(state.watchlist.length===0){sortBar.innerHTML='';platBar.innerHTML=''}
    return;
  }
  empty.classList.add('hidden');
  grid.innerHTML=movies.map(m=>`
    <div class="wl-card" data-movieid="${m.id}">
      <div class="wl-delete-reveal"><i data-lucide="trash-2" class="w-5 h-5"></i> Remove</div>
      <div class="wl-card-inner">
        <div class="relative h-36 flex items-center justify-center" style="background:${m.posterGradient}">
          <span class="text-4xl">${m.emoji}</span>
          ${state.superlikes.includes(m.id)?'<span class="absolute top-2 left-2 text-sm">⭐</span>':''}
        </div>
        <div class="p-3">
          <h4 class="text-xs font-bold truncate">${m.title}</h4>
          <div class="flex items-center gap-1 mt-1"><span class="text-xs" style="color:#8b949e">${m.year}</span><span class="text-xs" style="color:#f0b429">⭐ ${m.rating}</span></div>
          <div class="flex gap-1 mt-1 flex-wrap">${m.platforms.map(p=>`<span class="platform-badge" style="background:${PLATFORM_COLORS[p]||'#333'};color:#fff;font-size:.5rem">${p}</span>`).join('')}</div>
        </div>
      </div>
    </div>
  `).join('');
  if(typeof lucide!=="undefined"&&typeof lucide.createIcons==="function")lucide.createIcons();
  // Attach swipe-to-remove & click handlers
  grid.querySelectorAll('.wl-card').forEach(c=>{
    const inner=c.querySelector('.wl-card-inner');
    const movieId=parseInt(c.dataset.movieid);
    let wlDrag=false,wlStartX=0,wlCurX=0;
    inner.addEventListener('pointerdown',(e)=>{
      wlDrag=true;wlStartX=e.clientX;wlCurX=0;
      inner.setPointerCapture(e.pointerId);
      inner.style.transition='none';
    });
    inner.addEventListener('pointermove',(e)=>{
      if(!wlDrag)return;
      wlCurX=e.clientX-wlStartX;
      if(wlCurX>0)wlCurX=0;
      inner.style.transform=`translateX(${wlCurX}px)`;
    });
    inner.addEventListener('pointerup',(e)=>{
      if(!wlDrag)return;wlDrag=false;
      if(wlCurX<-80){
        inner.style.transition='transform .3s ease, opacity .3s ease';
        inner.style.transform='translateX(-120%)';
        inner.style.opacity='0';
        setTimeout(()=>{
          state.watchlist=state.watchlist.filter(id=>id!==movieId);
          state.superlikes=state.superlikes.filter(id=>id!==movieId);
          save();renderWatchlist();
        },300);
      }else if(Math.abs(wlCurX)<5){
        inner.style.transition='transform .3s ease';
        inner.style.transform='translateX(0)';
        showDetail(movieId);
      }else{
        inner.style.transition='transform .3s ease';
        inner.style.transform='translateX(0)';
      }
    });
    inner.addEventListener('pointercancel',(e)=>{
      wlDrag=false;
      inner.style.transition='transform .3s ease';
      inner.style.transform='translateX(0)';
    });
  });
}

// ══════════════════════════════════════════
// SEARCH
// ══════════════════════════════════════════
function renderSearch(){
  const genreBar=document.getElementById('search-genre-bar');
  const platBar=document.getElementById('search-plat-bar');
  const decadeBar=document.getElementById('search-decade-bar');

  genreBar.innerHTML=['All',...ALL_GENRES].map(g=>`<button class="mood-pill${state.searchGenre===g?' active':''}" data-sg="${g}" style="font-size:.65rem">${g}</button>`).join('');
  genreBar.querySelectorAll('[data-sg]').forEach(b=>b.addEventListener('click',()=>{state.searchGenre=b.dataset.sg;doSearch()}));

  platBar.innerHTML=['All',...ALL_PLATFORMS].map(p=>`<button class="mood-pill${state.searchPlatform===p?' active':''}" data-sp="${p}" style="font-size:.65rem">${p}</button>`).join('');
  platBar.querySelectorAll('[data-sp]').forEach(b=>b.addEventListener('click',()=>{state.searchPlatform=b.dataset.sp;doSearch()}));

  decadeBar.innerHTML=['All','90s','00s','10s','20s'].map(d=>`<button class="mood-pill${state.searchDecade===d?' active':''}" data-sd="${d}" style="font-size:.65rem">${d}</button>`).join('');
  decadeBar.querySelectorAll('[data-sd]').forEach(b=>b.addEventListener('click',()=>{state.searchDecade=b.dataset.sd;doSearch()}));

  doSearch();
}
function doSearch(){
  const q=state.searchQuery.toLowerCase();
  let results=MOVIES.filter(m=>{
    if(q&&!m.title.toLowerCase().includes(q)&&!m.cast.some(c=>c.toLowerCase().includes(q))&&!m.director.toLowerCase().includes(q))return false;
    if(state.searchGenre!=='All'&&!m.genres.includes(state.searchGenre))return false;
    if(state.searchPlatform!=='All'&&!m.platforms.includes(state.searchPlatform))return false;
    if(state.searchDecade!=='All'&&getDecade(m.year)!==state.searchDecade)return false;
    return true;
  });
  // Default: show top-rated when no query or filters active
  results.sort((a,b)=>b.rating-a.rating);

  const grid=document.getElementById('search-results');
  grid.innerHTML=results.map(m=>`
    <div class="wl-card search-card" data-movieid="${m.id}">
      <div class="relative h-32 flex items-center justify-center" style="background:${m.posterGradient}">
        <span class="text-3xl">${m.emoji}</span>
      </div>
      <div class="p-2">
        <h4 class="text-xs font-bold truncate">${m.title}</h4>
        <div class="flex items-center gap-1 mt-1"><span class="text-xs" style="color:#8b949e">${m.year}</span><span class="text-xs" style="color:#f0b429">⭐ ${m.rating}</span></div>
      </div>
    </div>
  `).join('');
  grid.querySelectorAll('.search-card').forEach(c=>c.addEventListener('click',()=>showDetail(parseInt(c.dataset.movieid))));
  // Update active states on filter pills
  const genreBar=document.getElementById('search-genre-bar');
  genreBar.querySelectorAll('.mood-pill').forEach(b=>{b.classList.toggle('active',b.dataset.sg===state.searchGenre)});
  const platBar=document.getElementById('search-plat-bar');
  platBar.querySelectorAll('.mood-pill').forEach(b=>{b.classList.toggle('active',b.dataset.sp===state.searchPlatform)});
  const decadeBar=document.getElementById('search-decade-bar');
  decadeBar.querySelectorAll('.mood-pill').forEach(b=>{b.classList.toggle('active',b.dataset.sd===state.searchDecade)});
}

// ══════════════════════════════════════════
// PROFILE (animated bar chart)
// ══════════════════════════════════════════
function renderProfile(){
  const cont=document.getElementById('profile-content');
  const t=state.taste;
  const totalSwipes=state.swipes.length;
  const liked=state.swipes.filter(s=>s.direction==='like'||s.direction==='super').length;
  const superLiked=state.swipes.filter(s=>s.direction==='super').length;
  const likeRate=totalSwipes?Math.round(liked/totalSwipes*100):0;

  if(totalSwipes===0){
    cont.innerHTML=`<div class="flex flex-col items-center py-16 text-center"><div class="text-5xl mb-4">🎬</div><h3 class="text-lg font-bold mb-2">No Swipes Yet</h3><p class="text-sm" style="color:#8b949e">Swipe some movies to build your taste profile</p></div>`;
    return;
  }

  const genreEntries=Object.entries(t.genreScores).sort((a,b)=>b[1]-a[1]);
  const topGenre=genreEntries.length?genreEntries[0][0]:'Drama';
  const avatarEmojis={Action:'💥',Drama:'🎭',Comedy:'😂',Horror:'👻','Sci-Fi':'🚀',Romance:'💕',Thriller:'🔍',Animation:'✨',Crime:'🕵️',Mystery:'🔮',War:'⚔️',Adventure:'🌍',Musical:'🎶',Fantasy:'🦄'};
  const titles={Action:'The Thrill Seeker',Drama:'The Deep Thinker',Comedy:'The Comedy Connoisseur',Horror:'The Fright Night Fan','Sci-Fi':'The Sci-Fi Geek',Romance:'The Rom-Com Romantic',Thriller:'The Edge-of-Seat Expert',Animation:'The Animation Aficionado',Crime:'The Crime Story Buff',Mystery:'The Mystery Maven',War:'The War Film Historian',Adventure:'The Adventure Seeker',Musical:'The Musical Enthusiast',Fantasy:'The Fantasy Dreamer'};

  const maxGenre=genreEntries.length?Math.max(genreEntries[0][1],1):1;
  const genreBars=genreEntries.filter(([,v])=>v>0).slice(0,6).map(([g,v],idx)=>`
    <div class="flex items-center gap-2 mb-2">
      <span class="text-xs font-bold w-16 text-right" style="color:#8b949e">${g}</span>
      <div class="flex-1 rounded-md overflow-hidden" style="background:#21262d;height:24px">
        <div class="bar-fill" data-target-width="${Math.max(8,v/maxGenre*100)}" style="width:0;transition-delay:${idx*100}ms"></div>
      </div>
      <span class="text-xs font-bold w-6" style="color:#f0b429">${v}</span>
    </div>
  `).join('');

  const platEntries=Object.entries(t.platformScores).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const platTotal=platEntries.reduce((s,[,v])=>s+v,0)||1;
  const platPills=platEntries.slice(0,6).map(([p,v])=>`<span class="px-3 py-1 rounded-full text-xs font-bold" style="background:${PLATFORM_COLORS[p]||'#333'};color:#fff">${p} ${Math.round(v/platTotal*100)}%</span>`).join('');

  const decEntries=Object.entries(t.decadeScores).sort((a,b)=>b[1]-a[1]);
  const favDecade=decEntries.length?decEntries[0][0]:'—';

  const dirEntries=Object.entries(t.directorScores).filter(([,v])=>v>=2).sort((a,b)=>b[1]-a[1]);

  const recent=state.swipes.slice(-5).reverse();
  const recentHTML=recent.map(s=>{
    const m=MOVIES.find(mv=>mv.id===s.id);if(!m)return'';
    const icon=s.direction==='like'?'❤️':s.direction==='super'?'⭐':'❌';
    return`<div class="flex items-center gap-3 py-2" style="border-bottom:1px solid #21262d"><span class="text-lg">${icon}</span><span class="text-sm flex-1">${m.title}</span><span class="text-xs" style="color:#8b949e">${m.year}</span></div>`;
  }).join('');

  cont.innerHTML=`
    <div class="text-center mb-6 pt-2">
      <div class="text-5xl mb-2">${avatarEmojis[topGenre]||'🎬'}</div>
      <h2 class="text-xl font-bold mb-1">${titles[topGenre]||'Movie Lover'}</h2>
      <p class="text-xs" style="color:#8b949e">Your taste profile based on ${totalSwipes} swipes</p>
    </div>
    <div class="flex gap-2 mb-6">
      <div class="stat-card"><div class="stat-num">${totalSwipes}</div><div class="stat-label">Swiped</div></div>
      <div class="stat-card"><div class="stat-num">${liked}</div><div class="stat-label">Liked</div></div>
      <div class="stat-card"><div class="stat-num">${superLiked}</div><div class="stat-label">Super</div></div>
      <div class="stat-card"><div class="stat-num">${likeRate}%</div><div class="stat-label">Rate</div></div>
    </div>
    <div class="mb-6">
      <h3 class="text-sm font-bold mb-3" style="color:#f0b429">🎯 Top Genres</h3>
      ${genreBars||'<p class="text-xs" style="color:#8b949e">No data yet</p>'}
    </div>
    <div class="mb-6">
      <h3 class="text-sm font-bold mb-3" style="color:#f0b429">📺 Top Platforms</h3>
      <div class="flex flex-wrap gap-2">${platPills||'<p class="text-xs" style="color:#8b949e">No data yet</p>'}</div>
    </div>
    <div class="mb-6">
      <h3 class="text-sm font-bold mb-3" style="color:#f0b429">📅 Favorite Decade</h3>
      <span class="px-4 py-2 rounded-full text-sm font-bold" style="background:rgba(240,180,41,.15);color:#f0b429;border:1px solid #f0b429">${favDecade}</span>
    </div>
    ${dirEntries.length?`<div class="mb-6"><h3 class="text-sm font-bold mb-3" style="color:#f0b429">🎬 Directors You Love</h3><div class="space-y-1">${dirEntries.map(([d,v])=>`<div class="text-sm"><span style="color:#e6edf3">${d}</span> <span class="text-xs" style="color:#8b949e">(${v} pts)</span></div>`).join('')}</div></div>`:''}
    <div class="mb-6">
      <h3 class="text-sm font-bold mb-3" style="color:#f0b429">⏱️ Recent Activity</h3>
      ${recentHTML||'<p class="text-xs" style="color:#8b949e">No recent swipes</p>'}
    </div>
    <div class="space-y-3 pt-4" style="border-top:1px solid #30363d">
      <h3 class="text-sm font-bold" style="color:#8b949e">Settings</h3>
      <div class="flex gap-3">
        <button id="clear-history-btn" class="flex-1 py-2 rounded-lg text-xs font-bold" style="background:#21262d;color:#e50914;border:1px solid #30363d;cursor:pointer">Clear History</button>
        <button id="export-wl-btn" class="flex-1 py-2 rounded-lg text-xs font-bold" style="background:#21262d;color:#22c55e;border:1px solid #30363d;cursor:pointer">Export Watchlist</button>
      </div>
    </div>
  `;

  // Animate bars in after render
  requestAnimationFrame(()=>{
    setTimeout(()=>{
      cont.querySelectorAll('.bar-fill[data-target-width]').forEach(bar=>{
        bar.style.width=bar.dataset.targetWidth+'%';
      });
    },50);
  });

  document.getElementById('clear-history-btn').addEventListener('click',()=>{
    if(confirm('Clear all swipe history and taste data?')){
      state.watchlist=[];state.superlikes=[];state.taste={genreScores:{},moodScores:{},decadeScores:{},platformScores:{},directorScores:{},ratingMin:10};state.swipes=[];
      save();buildDeck();renderCards();renderProfile();
    }
  });
  document.getElementById('export-wl-btn').addEventListener('click',()=>{
    const movies=state.watchlist.map(id=>MOVIES.find(m=>m.id===id)).filter(Boolean);
    const text=movies.map(m=>`${m.title} (${m.year}) — ⭐ ${m.rating} — ${m.platforms.join(', ')}`).join('\n');
    const blob=new Blob([text],{type:'text/plain'});const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='cineswipe-watchlist.txt';a.click();URL.revokeObjectURL(url);
  });
}

// ══════════════════════════════════════════
// MOVIE DETAIL MODAL
// ══════════════════════════════════════════
function showDetail(movieId){
  const m=MOVIES.find(mv=>mv.id===movieId);if(!m)return;
  const modal=document.getElementById('modal-overlay');
  const body=document.getElementById('modal-body');
  const inWatchlist=state.watchlist.includes(m.id);

  body.innerHTML=`
    <div class="relative h-48 flex items-center justify-center" style="background:${m.posterGradient}">
      <span class="text-6xl" style="filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))">${m.emoji}</span>
      <button id="close-detail-btn" class="absolute top-3 right-3 w-8 h-8 rounded-full flex items-center justify-center" style="background:rgba(0,0,0,.5);color:#fff;border:none;cursor:pointer"><i data-lucide="x" class="w-5 h-5"></i></button>
      ${state.superlikes.includes(m.id)?'<span class="absolute top-3 left-3 text-2xl">⭐</span>':''}
    </div>
    <div class="p-5">
      <h2 class="text-xl font-bold mb-1">${m.title}</h2>
      <div class="flex items-center gap-2 text-sm mb-3" style="color:#8b949e">
        <span>${m.year}</span><span>·</span>
        <span style="color:#f0b429">${'★'.repeat(Math.round(m.rating/2))}${'☆'.repeat(5-Math.round(m.rating/2))}</span>
        <span>${m.rating}</span><span>·</span><span>${m.runtime}</span>
      </div>
      <div class="flex flex-wrap gap-1.5 mb-3">${m.genres.map(g=>`<span class="genre-pill" style="background:rgba(240,180,41,.15);color:#f0b429;padding:4px 10px">${g}</span>`).join('')}</div>
      <p class="text-sm mb-4 leading-relaxed" style="color:#ccc">${m.description}</p>
      <div class="mb-3"><span class="text-xs font-bold" style="color:#8b949e">DIRECTOR</span><p class="text-sm font-medium mt-1">${m.director}</p></div>
      <div class="mb-3"><span class="text-xs font-bold" style="color:#8b949e">CAST</span><p class="text-sm mt-1" style="color:#ccc">${m.cast.join(' · ')}</p></div>
      <div class="flex flex-wrap gap-1.5 mb-4">
        ${m.platforms.map(p=>`<span class="platform-badge" style="background:${PLATFORM_COLORS[p]||'#333'};color:#fff;padding:4px 12px;font-size:.7rem">${p}</span>`).join('')}
      </div>
      <div class="flex gap-3">
        <button id="toggle-wl-btn" class="flex-1 py-3 rounded-xl text-sm font-bold" style="background:${inWatchlist?'#21262d':'rgba(240,180,41,.15)'};color:${inWatchlist?'#e50914':'#f0b429'};border:1px solid ${inWatchlist?'#e50914':'#f0b429'};cursor:pointer">${inWatchlist?'Remove ✕':'Add to Watchlist ❤️'}</button>
      </div>
    </div>
  `;
  if(typeof lucide!=="undefined"&&typeof lucide.createIcons==="function")lucide.createIcons();
  modal.classList.add('open');
  document.getElementById('close-detail-btn').addEventListener('click',()=>modal.classList.remove('open'));
  document.getElementById('toggle-wl-btn').addEventListener('click',()=>{
    if(state.watchlist.includes(m.id)){state.watchlist=state.watchlist.filter(id=>id!==m.id);state.superlikes=state.superlikes.filter(id=>id!==m.id)}
    else{state.watchlist.push(m.id)}
    save();showDetail(m.id);renderWatchlist();
  });
  modal.addEventListener('click',function handler(e){if(e.target===modal){modal.classList.remove('open');modal.removeEventListener('click',handler)}});
}

// ══════════════════════════════════════════
// TAB NAVIGATION
// ══════════════════════════════════════════
function switchTab(tab){
  state.currentTab=tab;
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.add('hidden'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  const tabEl=document.getElementById('tab-'+tab);
  if(tabEl)tabEl.classList.remove('hidden');
  document.querySelector(`.nav-btn[data-tab="${tab}"]`).classList.add('active');
  if(tab==='watchlist')renderWatchlist();
  if(tab==='search')renderSearch();
  if(tab==='profile')renderProfile();
}

// ══════════════════════════════════════════
// INITIALIZATION
// ══════════════════════════════════════════
async function initApp(){
  buildDeck();renderCards();renderMoods();

  if(typeof lucide!=="undefined"&&typeof lucide.createIcons==="function")lucide.createIcons();

  document.querySelectorAll('.nav-btn').forEach(btn=>{
    btn.addEventListener('click',()=>switchTab(btn.dataset.tab));
  });

  document.getElementById('btn-skip').addEventListener('click',()=>doSwipe('skip'));
  document.getElementById('btn-like').addEventListener('click',()=>doSwipe('like'));
  document.getElementById('btn-super').addEventListener('click',()=>doSwipe('super'));

  document.addEventListener('keydown',e=>{
    if(state.currentTab!=='discover')return;
    if(e.key==='ArrowRight')doSwipe('like');
    else if(e.key==='ArrowLeft')doSwipe('skip');
    else if(e.key==='ArrowUp'){e.preventDefault();doSwipe('super')}
  });

  document.getElementById('group-toggle').addEventListener('click',()=>{
    if(state.groupMode){
      state.groupMode=false;
      document.getElementById('group-turn').classList.add('hidden');
      document.getElementById('group-toggle').classList.remove('active');
      buildDeck();renderCards();
    }else{showGroupModal()}
  });

  document.getElementById('reset-deck').addEventListener('click',()=>{
    state.swipes=[];state.taste={genreScores:{},moodScores:{},decadeScores:{},platformScores:{},directorScores:{},ratingMin:10};
    state.sessionLiked=0;state.sessionSkipped=0;
    save();buildDeck();renderCards();
  });

  document.getElementById('go-discover').addEventListener('click',()=>switchTab('discover'));

  const searchInput=document.getElementById('search-input');
  const searchClear=document.getElementById('search-clear');
  searchInput.addEventListener('input',()=>{
    state.searchQuery=searchInput.value;
    searchClear.classList.toggle('hidden',!searchInput.value);
    doSearch();
  });
  searchClear.addEventListener('click',()=>{searchInput.value='';state.searchQuery='';searchClear.classList.add('hidden');doSearch()});
}

// ══════════════════════════════════════════
// BOOT
// ══════════════════════════════════════════
(async function boot(){
  if(typeof lucide!=="undefined"&&typeof lucide.createIcons==="function"){lucide.createIcons()}
  await loadState();
  showOnboarding();
  if(state.onboarded){document.getElementById('app-wrap').style.display='';await initApp()}
})();
</script>
